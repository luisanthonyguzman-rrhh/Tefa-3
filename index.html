<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f4eee5"
    >

    <title>Para Tefa ♡</title>


    <style>

       

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;
            min-height: 100svh;

            background: #f4eee5;

            color: #555a54;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(16px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            overflow-x: hidden;
        }


  
        .card {

            width: 100%;
            max-width: 520px;

            background: #fffaf3;

            border-radius: 24px;

            padding: 38px 32px 30px;

            text-align: center;

            box-shadow:
                0 18px 45px rgba(83, 78, 68, 0.13);

            position: relative;

            overflow: hidden;
        }


        .cat {

            position: absolute;

            top: 18px;
            right: 22px;

            font-size: 21px;

            opacity: 0.65;

            user-select: none;
        }


        .small-title {

            font-size: 11px;

            letter-spacing: 2.2px;

            text-transform: uppercase;

            color: #a29f91;

            margin-bottom: 13px;
        }



        h1 {

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(58px, 15vw, 82px);

            font-weight: normal;

            line-height: 1;

            color: #71816f;

            margin-bottom: 22px;
        }


        h1 span {

            color: #d99a82;
        }




        .question {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(22px, 5.8vw, 29px);

            line-height: 1.42;

            color: #555a54;

            margin-bottom: 25px;
        }


        .question strong {

            color: #c98370;

            font-weight: normal;
        }



        .photo {

            width: 100%;

            aspect-ratio: 4 / 3;

            border-radius: 18px;

            overflow: hidden;

            background: #dce3d8;

            margin-bottom: 24px;
        }


        .photo img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;
        }




        .message {

            max-width: 390px;

            margin: 0 auto 26px;

            font-size: 15px;

            line-height: 1.7;

            color: #777a73;
        }



        .buttons {

            display: flex;

            justify-content: center;

            gap: 11px;

            width: 100%;
        }


        button {

            border: none;

            border-radius: 30px;

            padding: 14px 21px;

            min-height: 48px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            font-size: 14px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }


        button:active {

            transform: scale(0.96);
        }


        .yes {

            background: #cbd9c6;

            color: #455342;
        }


        .think {

            background: #ead4c9;

            color: #76594e;
        }


        @media (hover: hover) {

            button:hover {

                transform: translateY(-2px);

                box-shadow:
                    0 6px 15px rgba(80, 75, 65, 0.12);
            }

        }


    

        .response {

            display: none;

            margin-top: 22px;

            padding: 18px 17px;

            border-radius: 16px;

            background: #f2e8dc;

            animation: aparecer 0.35s ease;
        }


        .response h2 {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 24px;

            font-weight: normal;

            color: #71816f;

            margin-bottom: 8px;
        }


        .response p {

            font-size: 14px;

            line-height: 1.6;

            color: #747870;
        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform: translateY(8px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        .footer {

            margin-top: 23px;

            font-size: 10px;

            letter-spacing: 1px;

            color: #aaa89e;
        }



        @media (max-width: 480px) {

            body {

                align-items: center;

                padding:
                    max(12px, env(safe-area-inset-top))
                    max(12px, env(safe-area-inset-right))
                    max(12px, env(safe-area-inset-bottom))
                    max(12px, env(safe-area-inset-left));
            }


            .card {

                padding:
                    35px
                    20px
                    27px;

                border-radius: 20px;
            }


            .cat {

                top: 14px;

                right: 16px;

                font-size: 19px;
            }


            .small-title {

                font-size: 10px;

                letter-spacing: 1.8px;
            }


            h1 {

                font-size: 62px;

                margin-bottom: 20px;
            }


            .question {

                font-size: 22px;

                margin-bottom: 22px;
            }


            .photo {

                aspect-ratio: 4 / 3;

                border-radius: 15px;

                margin-bottom: 21px;
            }


            .message {

                font-size: 14px;

                line-height: 1.65;

                margin-bottom: 23px;
            }


            .buttons {

                flex-direction: column;

                max-width: 290px;

                margin: 0 auto;

                gap: 9px;
            }


            button {

                width: 100%;

                min-height: 47px;
            }


            .response {

                margin-top: 19px;

                padding: 17px 14px;
            }


            .footer {

                margin-top: 20px;
            }
        }


        @media (max-height: 700px) and (max-width: 480px) {

            .card {

                padding-top: 27px;

                padding-bottom: 22px;
            }


            .small-title {

                margin-bottom: 9px;
            }


            h1 {

                font-size: 53px;

                margin-bottom: 15px;
            }


            .question {

                font-size: 20px;

                margin-bottom: 17px;
            }


            .photo {

                margin-bottom: 17px;
            }


            .message {

                margin-bottom: 18px;
            }


            .footer {

                margin-top: 14px;
            }
        }

    </style>

</head>


<body>


    <main class="card">



        <div class="cat">
            🐈
        </div>



        <div class="small-title">
            una invitación para ti
        </div>


        <h1>
            Tefa<span>
        </h1>


        <!-- Pregunta -->

        <div class="question">

            ¿Quisieras ir a hacer
            <strong>rafting</strong>
            al río Chilina conmigo
            el día sábado?

        </div>



        <div class="photo">

            <img
                src="balsa.jpg"
                alt="Tefa y yo en la balsa"
            >

        </div>


        <!-- Mensaje -->

        <p class="message">

            Pensé que podría ser bonito hacer
            algo diferente contigo.

            Un poco de aventura, unas risas
            y pasar un buen rato juntos.

        </p>


        <!-- Botones -->

        <div class="buttons">


            <button
                class="yes"
                id="yesButton"
                type="button"
            >

                Sí, vamos ♡

            </button>


            <button
                class="think"
                id="thinkButton"
                type="button"
            >

                Déjame pensarlo

            </button>


        </div>


        <!-- Respuesta -->

        <div
            class="response"
            id="response"
        >
        </div>


        <div class="footer">
            hecho para Tefa ♡
        </div>


    </main>


    <script>

        /* =========================
           BOTONES
        ========================= */

        const yesButton =
            document.getElementById("yesButton");

        const thinkButton =
            document.getElementById("thinkButton");

        const response =
            document.getElementById("response");


        /* =========================
           SÍ, VAMOS
        ========================= */

        yesButton.addEventListener(
            "click",
            function () {

                response.style.display = "block";

                response.innerHTML = `

                    <h2>
                        Entonces tenemos una cita ♡
                    </h2>

                    <p>
                        Me alegra que hayas dicho que sí.
                        Ahora solo falta esperar al sábado.
                        Prometo que la vamos a pasar muy bien.
                    </p>

                `;

                response.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });

            }
        );


        /* =========================
           DÉJAME PENSARLO
        ========================= */

        thinkButton.addEventListener(
            "click",
            function () {

                response.style.display = "block";

                response.innerHTML = `

                    <h2>
                        Está bien :)
                    </h2>

                    <p>
                        Piénsalo con calma...
                        aunque espero que al final
                        te animes a ir conmigo.
                    </p>

                `;

                response.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });

            }
        );

    </script>


</body>

</html>
